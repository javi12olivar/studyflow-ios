name: StudyFlow
options:
  bundleIdPrefix: com.studyflow
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  StudyFlow:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ContentView.swift
      - path: StudyFlowApp.swift
      - path: Models
      - path: Services
      - path: Views
      - path: Assets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studyflow.app
      INFOPLIST_FILE: Info.plist
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
      TARGETED_DEVICE_FAMILY: 1
      ENABLE_PREVIEWS: YES
      SWIFT_VERSION: "5.9"
